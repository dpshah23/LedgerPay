name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledgerpay
          POSTGRES_USER: ledgerpay
          POSTGRES_PASSWORD: ledgerpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerpay -d ledgerpay"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run checks
        env:
          DATABASE_URL: postgres://ledgerpay:ledgerpay@localhost:5432/ledgerpay
          TEST_DATABASE_URL: postgres://ledgerpay:ledgerpay@localhost:5432/ledgerpay_test
          DJANGO_SECRET_KEY: ci-test-key
          STRIPE_WEBHOOK_SECRET: whsec_ci_test
        run: |
          python manage.py check
          python manage.py test
